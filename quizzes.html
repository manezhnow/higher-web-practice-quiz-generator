<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ваши квизы</title>
    <link rel="stylesheet" href="./css/pages/quizzes.css" />
  </head>
  <body>
    <header id="header"></header>

    <main class="page" id="page">
      <div class="container">
        <section class="quizzes" id="quizzes" hidden>
          <h1 class="quizzes__title">Ваши квизы</h1>
          <ul class="quizzes__list" id="quizzes-list"></ul>
        </section>

        <section class="empty-state" id="empty-state" hidden>
          <div class="empty-state__text">
            <h1 class="empty-state__title">У вас нет сохранённых квизов(</h1>
            <p class="empty-state__subtitle">Но вы можете добавить!</p>
          </div>
          <a class="button button_wide-on-mobile" href="./index.html"> Добавить квиз </a>
        </section>
      </div>
    </main>

    <footer class="page__footer">Учебный проект 2026</footer>

    <template id="quiz-card-template">
      <li class="quizzes__item">
        <article class="card">
          <div class="card__content">
            <h2 class="card__title"></h2>
            <p class="card__description"></p>
          </div>
          <div class="card__footer">
            <p class="card__count"></p>
            <a class="card__link" href="./quiz.html">Пройти</a>
          </div>
        </article>
      </li>
    </template>

    <script type="module" src="./js/pages/quizzes.js"></script>
  </body>
</html>
