<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Генератор квизов</title>
    <link rel="stylesheet" href="./css/pages/index.css" />
  </head>
  <body>
    <header id="header"></header>

    <main class="page page_centered page_generator">
      <div class="container container_narrow">
        <section class="generator">
          <form class="generator__form" id="generator-form" novalidate>
            <div class="generator__content">
              <div class="generator__intro">
                <h1 class="generator__title">Генератор квизов</h1>
                <p class="generator__subtitle">Вставьте JSON…</p>
              </div>
              <div class="field">
                <label class="field__label" for="quiz-json">Ваш JSON</label>
                <textarea
                  class="field__control field__control_code"
                  id="quiz-json"
                  name="quizJson"
                  spellcheck="false"
                  placeholder='{&#10;  "title": "Название теста",&#10;  "questions": []&#10;}'
                ></textarea>
              </div>
            </div>

            <button class="button button_wide-on-mobile" type="submit">Сгенерировать</button>
          </form>
        </section>
      </div>
    </main>

    <script type="module" src="./js/pages/main.js"></script>
  </body>
</html>
